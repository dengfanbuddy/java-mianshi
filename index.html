<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#b0713c">
<meta name="description" content="针对邓凡简历定制的Java游戏服务器面试复习题库，554道题，含答案、追问、记忆钩子、自测模式、间隔重复。">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Java面试">
<title>Java 游戏服务器面试题库 · 邓凡专属复习版</title>
<style>
  :root{
    --bg:#faf7f2; --panel:#ffffff; --ink:#2e2a26; --muted:#8a8178;
    --accent:#b0713c; --accent-soft:#f3e6d8; --line:#e8e0d5;
    --lv1:#5e8c61; --lv2:#b0713c; --lv3:#a34a4a;
    --done:#5e8c61;
    --hl:#ffe066; --hl-ink:inherit;
    --lv1-bg:#e5efe4; --lv3-bg:#f5e2e0;
    --card-done-border:#cfdcc9; --card-done-bg:#fbfdfa;
    --point-bg:#eef3ec; --point-ink:#41584a;
    --approach-bg:#f6f1ea; --approach-border:#d8c9b4;
    --memo-ink:#6b4a2a; --body-ink:#3d3833; --fu-ink:#4a443e; --fua-ink:#6a6156;
    --scrollbar:#d8cfc2; --overlay:rgba(46,42,38,.35); --shadow:rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#1a1816; --panel:#252220; --ink:#e0d8cf; --muted:#8a8076;
    --accent:#c8895a; --accent-soft:#3a2f26; --line:#3a342e;
    --lv1:#7ab87e; --lv2:#c8895a; --lv3:#c97070;
    --done:#7ab87e;
    --hl:#665500; --hl-ink:#ffe066;
    --lv1-bg:#2a3a2c; --lv3-bg:#3a2a28;
    --card-done-border:#3a4a36; --card-done-bg:#1f2520;
    --point-bg:#1f2a20; --point-ink:#8eb89a;
    --approach-bg:#2a2520; --approach-border:#4a3f34;
    --memo-ink:#c8a572; --body-ink:#d0c8bf; --fu-ink:#c5bcb0; --fua-ink:#9a9085;
    --scrollbar:#4a423a; --overlay:rgba(0,0,0,.5); --shadow:rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden}
  #app{display:flex;height:100vh}

  /* iOS 安全区适配 */
  #menuBtn{top:calc(10px + env(safe-area-inset-top))}

  /* 左侧栏 */
  #sidebar{width:280px;min-width:280px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:width .2s ease,min-width .2s ease,border-color .2s ease}
  #sidebar.collapsed{width:0;min-width:0;overflow:hidden;border-right:none}
  #sidebar header{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
  #sidebar h1{font-size:16px;color:var(--accent);letter-spacing:.5px;line-height:1.4}
  #sidebar .sub{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
  #search{padding:12px 14px 6px}
  #search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;outline:none}
  #search input:focus{border-color:var(--accent)}
  #scopeLbl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:0 16px 10px;cursor:pointer;user-select:none}
  #scopeLbl input{accent-color:var(--accent)}

  /* 底部收纳区 */
  #sideFoot{position:relative;border-top:1px solid var(--line);padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
  .footbtn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:13px;cursor:pointer;color:var(--ink);transition:background .15s}
  .footbtn:hover{background:var(--accent-soft)}
  .footbtn.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
  .footbtn .badge{margin-left:auto;font-size:11px;background:var(--accent);color:#fff;border-radius:10px;padding:1px 8px;min-width:22px;text-align:center}
  .footbtn .badge.zero{background:#c9c0b4}

  /* 收纳浮层面板：从底部按钮向上弹出 */
  #tools,#helpBox{position:absolute;left:12px;right:12px;bottom:calc(100% + 8px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 -6px 20px var(--shadow);display:flex;flex-direction:column;gap:5px;z-index:30}
  #tools.hidden,#helpBox.hidden{display:none}
  .tool{display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;cursor:pointer;color:var(--ink);transition:background .15s}
  .tool:hover{background:var(--accent-soft)}
  .tool.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
  .tool .badge{margin-left:auto;font-size:11px;background:var(--accent);color:#fff;border-radius:10px;padding:1px 8px;min-width:22px;text-align:center}
  .tool .badge.zero{background:#c9c0b4}
  #helpBox{font-size:12px;color:var(--muted);line-height:1.9;padding:12px 14px}
  #helpBox b{color:var(--accent)}
  #helpBox .hp{display:flex;gap:6px;align-items:flex-start}
  #helpBox .hp+.hp{margin-top:8px}

  #cats{flex:1;overflow-y:auto;padding:8px 10px 16px}
  .cat{display:flex;align-items:center;gap:9px;padding:10px 10px;border-radius:9px;cursor:pointer;margin-bottom:2px;transition:background .15s}
  .cat:hover{background:var(--accent-soft)}
  .cat.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
  .cat .ico{font-size:17px}
  .cat .nm{font-size:14px;flex:1}
  .cat .cnt{font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
  .cat .bar{height:3px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden}
  .cat .bar i{display:block;height:100%;background:var(--done);width:0%}
  #overall{padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  #overall .bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
  #overall .bar i{display:block;height:100%;background:var(--done);width:0%}

  /* 右侧 */
  #main{flex:1;overflow-y:auto;padding:calc(26px + env(safe-area-inset-top)) 34px calc(80px + env(safe-area-inset-bottom))}
  #cathead{margin-bottom:18px}
  #cathead h2{font-size:22px;display:flex;align-items:center;gap:10px}
  #cathead p{color:var(--muted);font-size:13px;margin-top:8px;line-height:1.7}
  #filters{display:flex;gap:8px;margin:14px 0 20px;flex-wrap:wrap;align-items:center}
  .chip{padding:5px 14px;border-radius:16px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;cursor:pointer;color:var(--muted)}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  #statsline{font-size:12px;color:var(--muted);margin-left:auto}

  .qcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
  .qcard.done{border-color:var(--card-done-border);background:var(--card-done-bg)}
  .qhead{display:flex;align-items:flex-start;gap:12px;padding:15px 18px;cursor:pointer}
  .qhead .no{font-size:11px;color:var(--muted);padding-top:3px;min-width:44px}
  .qhead .qt{flex:1;font-size:15px;font-weight:600;line-height:1.55}
  .catbadge{display:inline-block;font-size:11px;font-weight:400;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:1px 7px;margin-right:7px}
  .lv{font-size:11px;padding:2px 9px;border-radius:10px;white-space:nowrap;margin-top:2px}
  .lv1{background:var(--lv1-bg);color:var(--lv1)} .lv2{background:var(--accent-soft);color:var(--lv2)} .lv3{background:var(--lv3-bg);color:var(--lv3)}
  .qbody{display:none;padding:0 20px 18px 74px}
  .qcard.open .qbody{display:block}
  .sec{margin-top:12px}
  .sec .st{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px;letter-spacing:1px}
  .sec .sc{font-size:13.5px;line-height:1.85;white-space:pre-wrap;color:var(--body-ink)}
  .fu li{font-size:13px;line-height:1.8;margin-left:18px;color:var(--fu-ink);margin-bottom:8px}
  .fu .fuq{font-weight:600;color:var(--body-ink)}
  .fu .fua{color:var(--fua-ink)}
  .pointline{margin-top:2px;background:var(--point-bg);border-left:3px solid var(--lv1);border-radius:0 8px 8px 0;padding:8px 13px;font-size:13px;line-height:1.7;color:var(--point-ink)}
  .approachbox{background:var(--approach-bg);border:1px dashed var(--approach-border);border-radius:8px;padding:9px 13px}
  .memobox{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:9px 13px;font-size:13px;line-height:1.7;color:var(--memo-ink)}
  .tagsline{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tag{font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:1px 8px}
  .donebtn{margin-left:auto;font-size:12px;padding:4px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--muted)}
  .donebtn.on{background:var(--done);color:#fff;border-color:var(--done)}
  .wrbtn,.rvbtn{font-size:12px;padding:4px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--muted)}
  .wrbtn:hover{border-color:var(--lv3);color:var(--lv3)}
  .rvbtn:hover{border-color:var(--done);color:var(--done)}
  .tutlink{font-size:12px;padding:4px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--accent)}
  .tutlink:hover{background:var(--accent-soft);border-color:var(--accent)}
  .tutbtn{font-size:14px;cursor:pointer;padding:3px 6px;border-radius:8px;flex-shrink:0;opacity:.85;transition:background .15s,opacity .15s}
  .tutbtn:hover{background:var(--accent-soft);opacity:1}
  .tutline{font-size:11px;color:var(--muted);margin-top:3px}
  #empty{color:var(--muted);text-align:center;padding:60px 0;font-size:14px}

  /* 自测模式 */
  .quizbox .qprog{font-size:13px;color:var(--muted);margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .quizctl{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
  .qbtn{padding:11px 22px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:15px;cursor:pointer;color:var(--ink);transition:transform .08s}
  .qbtn:active{transform:scale(.97)}
  .qbtn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .qbtn.g1{background:var(--lv1-bg);border-color:var(--card-done-border);color:var(--lv1);font-weight:600}
  .qbtn.g2{background:var(--accent-soft);border-color:var(--approach-border);color:var(--lv2);font-weight:600}
  .qbtn.g3{background:var(--lv3-bg);border-color:var(--lv3);color:var(--lv3);font-weight:600;opacity:.8}
  .qbtn.sel{outline:2px solid currentColor;outline-offset:-2px}
  .qhint{font-size:12px;color:var(--muted)}
  .quizend{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:36px 28px;text-align:center}
  .quizend .big{font-size:42px;margin-bottom:8px}
  .quizend h3{font-size:19px;margin-bottom:14px;color:var(--accent)}
  .quizend .stat{display:flex;justify-content:center;gap:26px;margin:16px 0 24px;font-size:14px;color:var(--muted);flex-wrap:wrap}
  .quizend .stat b{display:block;font-size:24px;color:var(--ink)}

  /* 搜索高亮 */
  mark{background:var(--hl);color:var(--hl-ink);border-radius:2px;padding:0 1px}

  /* 主题切换 */
  #themeToggle{cursor:pointer;font-size:16px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);transition:background .15s;line-height:1}
  #themeToggle:hover{background:var(--accent-soft)}
  #sidebar header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  #sidebar header>div:first-child{flex:1}

  /* 备份恢复 */
  .tool.importover{flex-direction:column;align-items:flex-start;gap:4px;font-size:12px;color:var(--muted);line-height:1.5}

  /* 统计看板 */
  .dashgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px}
  .dashcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  .dashcard h3{font-size:14px;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:6px}
  .dashrow{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px}
  .dashrow .lbl{width:130px;flex-shrink:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dashrow .track{flex:1;height:7px;border-radius:4px;background:var(--bg);overflow:hidden}
  .dashrow .track i{display:block;height:100%;border-radius:4px}
  .dashrow .val{width:52px;text-align:right;font-size:11px;color:var(--muted);flex-shrink:0}
  .donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .donut{width:130px;height:130px;flex-shrink:0}
  .donut-legend{font-size:13px;line-height:2}
  .donut-legend .dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px}
  .stat-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center}
  .stat-box .num{font-size:28px;font-weight:700;color:var(--accent)}
  .stat-box .lbl{font-size:12px;color:var(--muted);margin-top:4px}
  .lv-pie{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .lv-pie svg{flex-shrink:0}

  /* ===== 教程知识库 ===== */
  .tutbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .tutbar h2{font-size:19px;display:flex;align-items:center;gap:8px}
  .tutbar .tb-prog{margin-left:auto;font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px 12px}
  .tutbar .tb-prog b{color:var(--accent)}
  .tutbar .btn{font-size:12.5px;padding:6px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--ink)}
  .tutbar .btn:hover{background:var(--accent-soft);border-color:var(--accent)}
  .tutbar .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  #tutGraphWrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto}
  #tutGraphWrap svg{display:block;min-width:620px;width:100%;height:auto}
  .g-node{cursor:pointer}
  .g-node rect{fill:var(--panel);stroke:var(--line);stroke-width:1.5;rx:10}
  .g-node:hover rect{stroke:var(--accent)}
  .g-node.done rect{stroke:var(--done);fill:var(--card-done-bg)}
  .g-node.locked{opacity:.42}
  .g-node .t1{fill:var(--ink);font-size:12.5px;font-weight:600}
  .g-node .t2{fill:var(--muted);font-size:11px}
  .g-edge{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.75}
  .g-layer{fill:var(--accent);font-size:12px;font-weight:700;letter-spacing:2px}
  .g-hint{font-size:12px;color:var(--muted);line-height:1.7;margin:10px 2px 0}
  .g-hint b{color:var(--accent)}
  .tutwrap{display:flex;gap:16px;align-items:flex-start}
  .tutnav{width:228px;min-width:228px;position:sticky;top:6px;max-height:calc(100vh - 130px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 8px;flex-shrink:0}
  .tutnav .tn-l{font-size:11px;color:var(--muted);margin:10px 6px 5px;letter-spacing:2px;font-weight:700}
  .tutnav .tn-item{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--ink);line-height:1.45}
  .tutnav .tn-item:hover{background:var(--accent-soft)}
  .tutnav .tn-item.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
  .tutnav .tn-item.locked{opacity:.45;cursor:not-allowed}
  .tutnav .tn-item .st{margin-left:auto;font-size:11px;color:var(--muted)}
  .tutnav .tn-item.done .st{color:var(--done)}
  .tutmain{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px 28px 34px}
  .tutmain .tm-head{margin-bottom:6px}
  .tutmain .tm-title{font-size:21px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tutmain .tm-meta{font-size:12px;color:var(--muted);margin:8px 0 14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .tutmain .tm-meta .chip-lv{font-size:11px;padding:2px 10px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
  .tb-block{margin:14px 0}
  .tb-lead{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 16px;font-size:14px;line-height:1.8;color:var(--body-ink);font-weight:600}
  .tb-pre{background:var(--point-bg);border-radius:10px;padding:10px 16px;font-size:13px;line-height:1.9;color:var(--point-ink)}
  .tb-pre b{color:var(--accent)}
  .tb-h{font-size:16px;font-weight:700;color:var(--accent);margin:24px 0 8px;padding-left:10px;border-left:4px solid var(--accent)}
  .tb-p{font-size:14px;line-height:1.95;color:var(--body-ink);margin:10px 0}
  .tb-list{margin:10px 0 10px 6px;list-style:none}
  .tb-list li{font-size:13.5px;line-height:1.9;color:var(--body-ink);padding-left:20px;position:relative;margin-bottom:4px}
  .tb-list li::before{content:"▸";position:absolute;left:2px;color:var(--accent)}
  .tb-code{background:var(--bg);border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow-x:auto}
  .tb-code .cd-lang{font-size:10.5px;color:var(--muted);padding:5px 12px;border-bottom:1px solid var(--line);letter-spacing:1px;display:flex;justify-content:space-between}
  .tb-code pre{margin:0;padding:12px 14px;font-family:Consolas,"Courier New",monospace;font-size:12.5px;line-height:1.7;color:var(--body-ink);white-space:pre;overflow-x:auto}
  .tb-svg{margin:14px 0;text-align:center}
  .tb-svg svg{max-width:100%;height:auto;display:inline-block}
  .tb-svg .cap{font-size:12px;color:var(--muted);margin-top:6px;text-align:center}
  .tb-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
  .tb-table th{background:var(--accent-soft);color:var(--accent);padding:8px 12px;text-align:left;border:1px solid var(--line);font-weight:700}
  .tb-table td{padding:8px 12px;border:1px solid var(--line);color:var(--body-ink);line-height:1.7}
  .tb-table tr:nth-child(even) td{background:var(--bg)}
  .tb-pits{background:var(--lv3-bg);border-left:4px solid var(--lv3);border-radius:0 10px 10px 0;padding:12px 16px;margin:14px 0}
  .tb-pits .pt{font-weight:700;color:var(--lv3);font-size:13px;margin-bottom:8px}
  .tb-pits li{font-size:13px;line-height:1.85;color:var(--body-ink);margin-left:18px;margin-bottom:6px}
  .tb-pits li b{color:var(--lv3)}
  .tb-callout{border-radius:10px;padding:11px 15px;font-size:13px;line-height:1.8;margin:12px 0}
  .tb-callout.tip{background:var(--lv1-bg);color:var(--point-ink);border:1px solid var(--card-done-border)}
  .tb-callout.warn{background:var(--accent-soft);border:1px dashed var(--approach-border);color:var(--memo-ink)}
  .tb-callout.unverified{background:var(--lv3-bg);border:1px dashed var(--lv3);color:var(--lv3)}

<script>
const ORDER = ["study-methods","memory","java-basic","java-concurrent","jvm","mysql","redis","spring","design-pattern","netty","linux","mq","microservice","algorithm","game-server","scenario","resume-deepdive","ai-app"];
const LEVELS = {1:"基础必会",2:"进阶高频",3:"深挖架构"};
const INTERVALS = [1,3,7,15]; // 间隔重复节奏（天）
const store = {
  get done(){ try{return JSON.parse(localStorage.getItem("qb_done")||"{}")}catch(e){return{}} },
  set done(v){ localStorage.setItem("qb_done", JSON.stringify(v)) },
  get doneTS(){ try{return JSON.parse(localStorage.getItem("qb_done_ts")||"{}")}catch(e){return{}} },
  set doneTS(v){ localStorage.setItem("qb_done_ts", JSON.stringify(v)) },
  get wrong(){ try{return JSON.parse(localStorage.getItem("qb_wrong")||"{}")}catch(e){return{}} },
  set wrong(v){ localStorage.setItem("qb_wrong", JSON.stringify(v)) },
  get review(){ try{return JSON.parse(localStorage.getItem("qb_review")||"{}")}catch(e){return{}} },
  set review(v){ localStorage.setItem("qb_review", JSON.stringify(v)) },
  get tutDone(){ try{return JSON.parse(localStorage.getItem("qb_tut_done")||"{}")}catch(e){return{}} },
  set tutDone(v){ localStorage.setItem("qb_tut_done", JSON.stringify(v)) },
  get tutPos(){ try{return JSON.parse(localStorage.getItem("qb_tut_pos")||"{}")}catch(e){return{}} },
  set tutPos(v){ localStorage.setItem("qb_tut_pos", JSON.stringify(v)) },
  get tutNote(){ try{return JSON.parse(localStorage.getItem("qb_tut_note")||"{}")}catch(e){return{}} },
  set tutNote(v){ localStorage.setItem("qb_tut_note", JSON.stringify(v)) }
};
let curCat = localStorage.getItem("qb_cat") || "memory";
let curLv = 0, kw = "";
let view = "cat";                 // cat | wrong | due | quiz | dash | tut | tutread | tutsearch
let scopeAll = localStorage.getItem("qb_scope") !== "0";
let scopeTut = localStorage.getItem("qb_scope_tut") === "1";
let quiz = null;
let tutCat = "", tutNode = "", tutBack = null;

/* ---- 教程数据工具 ---- */
function tutOf(catId){ return (window.TB||{})[catId] || null; }
function tutCats(){ return ORDER.map(id=>tutOf(id)).filter(Boolean); }
function tutNodeById(tb, id){ return (tb.nodes||[]).find(n=>n.id===id) || null; }
function tutNodeDone(n){ return !!store.tutDone[n.id]; }
function tutNodeLocked(tb, n){
  if(store.tutDone[n.id]) return false;
  return (n.depends||[]).some(d=>!store.tutDone[d]);
}
function tutProgress(tb){
  const total = tb.nodes.length;
  const done = tb.nodes.filter(n=>store.tutDone[n.id]).length;
  return {done, total};
}
function setTutDone(nodeId, on){
  const d = store.tutDone;
  if(on) d[nodeId] = Date.now(); else delete d[nodeId];
  store.tutDone = d;
}
const tutIndex = {}; // qid -> {cat, node}
(function(){
  for(const catId in (window.TB||{})){
    const tb = window.TB[catId]; if(!tb||!tb.nodes) continue;
    for(const n of tb.nodes){
      (n.covers||[]).forEach(q=>{ if(!tutIndex[q]) tutIndex[q]={cat:catId, node:n}; });
    }
  }
})();
function tutOfQ(qid){ return tutIndex[qid]||null; }
function goTutCat(catId){
  tutCat = catId; tutNode = ""; tutBack = null;
  view = "tut"; kw = ""; qInput.value = "";
  closeMobileSidebar(); renderAll(); main.scrollTop = 0;
}
function goTutNode(catId, nodeId){
  tutCat = catId; tutNode = nodeId;
  tutBack = {view, curCat, curLv, kw};
  view = "tutread"; closeMobileSidebar();
  renderAll();
}
function goTutByQ(qid){
  const t = tutOfQ(qid);
  if(!t){ alert("该题暂无配套教程章节"); return; }
  goTutNode(t.cat, t.node.id);
}
function goTutBack(){
  if(tutBack && tutBack.view){ view = tutBack.view; curCat = tutBack.curCat||curCat; kw = tutBack.kw||""; qInput.value = kw; }
  else view = "tut";
  tutBack = null;
  renderAll();
}

// 兼容旧数据：已有 qb_done 但无时间戳的，补当前时间
(function(){
  const d = store.done, t = store.doneTS; let changed = false;
  for(const id in d) if(d[id] && !t[id]){ t[id] = Date.now(); changed = true; }
  if(changed) store.doneTS = t;
})();

/* ---- 主题切换 ---- */
const themeBtn = document.getElementById("themeToggle");
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === "dark" ? "☀️" : "🌙";
  localStorage.setItem("qb_theme", t);
}
applyTheme(localStorage.getItem("qb_theme") || "light");
themeBtn.onclick = () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

/* ---- 搜索高亮 ---- */
function hl(s, keyword){
  s = esc(s);
  if(!keyword) return s;
  const kw = esc(keyword).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return s.replace(new RegExp(kw, "gi"), m => `<mark>${m}</mark>`);
}

const catsEl = document.getElementById("cats"), main = document.getElementById("list");
const qInput = document.getElementById("q"), scopeBox = document.getElementById("scopeAll");
scopeBox.checked = scopeAll;

function cats(){ return ORDER.map(id=>window.QB[id]).filter(Boolean); }
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function findQ(id){
  for(const c of cats()){ const q = c.questions.find(x=>x.id===id); if(q) return {q, cat:c.id, catName:c.name}; }
  return null;
}
function matchKw(q, k){
  return ((q.q+q.a+(q.point||"")+(q.approach||"")+(q.tags||[]).join("")+(q.followups||[]).map(f=>typeof f==="object"?(f.q+f.a):f).join("")).toLowerCase().includes(k));
}

/* ---- 状态操作 ---- */
function setDone(id, on){
  const d = store.done, t = store.doneTS, w = store.wrong, r = store.review;
  if(on){ d[id] = true; t[id] = Date.now(); delete w[id]; }   // 掌握时重置复习计时，并自动移出错题本
  else { delete d[id]; delete t[id]; delete r[id]; }
  store.done = d; store.doneTS = t; store.wrong = w; store.review = r;
}
function addWrong(q, catId){
  const w = store.wrong;
  w[q.id] = {cat:catId, ts:Date.now(), level:q.level};
  store.wrong = w;
}
function removeWrong(id){
  const w = store.wrong; delete w[id]; store.wrong = w;
}
function stageOf(id){
  const t = store.doneTS[id]; if(!t) return 0;
  const days = (Date.now()-t)/864e5;
  let s = 0; for(const iv of INTERVALS) if(days>=iv) s++;
  return s;
}
function dueList(){
  const d = store.done, r = store.review, out = [];
  for(const id in d){
    if(!d[id]) continue;
    const st = stageOf(id);
    if(st>0 && st>(r[id]||0)){
      const f = findQ(id);
      if(f) out.push({q:f.q, cat:f.cat, catName:f.catName, stage:st});
    }
  }
  return out;
}
function markReviewed(id, stage){
  const r = store.review; r[id] = stage; store.review = r;
}

/* ---- 卡片渲染 ---- */
function qbodyHTML(q, extraBtn, plain){
  const done = store.done, k = kw.trim();
  const tagsRow = plain
    ? `${(q.tags||[]).map(t=>`<span class="tag">#${hl(t,k)}</span>`).join("")}`
    : `<div class="tagsline">
      ${(q.tags||[]).map(t=>`<span class="tag">#${hl(t,k)}</span>`).join("")}
      ${tutOfQ(q.id)?`<button class="tutlink" data-tutlink="${q.id}" title="知识有欠缺？进教程补课">📘 补课</button>`:""}
      ${extraBtn||""}
      <button class="donebtn ${done[q.id]?'on':''}" data-id="${q.id}">${done[q.id]?"✓ 已掌握":"标记掌握"}</button>
    </div>`;
  return `
    ${q.point?`<div class="pointline">🎯 考点：${hl(q.point,k)}</div>`:""}
    ${q.approach?`<div class="sec"><div class="st">🧭 回答思路</div><div class="sc approachbox">${hl(q.approach,k)}</div></div>`:""}
    <div class="sec"><div class="st">📖 参考答案</div><div class="sc">${hl(q.a,k)}</div></div>
    ${q.followups&&q.followups.length?`<div class="sec"><div class="st">🔥 举一反三 · 面试官可能继续深挖</div><ul class="fu">${q.followups.map(f=>typeof f==="object"
      ?`<li><span class="fuq">Q：${hl(f.q,k)}</span><br><span class="fua">A：${hl(f.a,k)}</span></li>`
      :`<li>${hl(f,k)}</li>`).join("")}</ul></div>`:""}
    ${q.memory?`<div class="sec"><div class="st">🧠 记忆钩子</div><div class="memobox">${hl(q.memory,k)}</div></div>`:""}
    ${tagsRow}`;
}

/* ---- 自测模式 ---- */
function startQuiz(){
  const c = window.QB[curCat];
  if(!c) return;
  let pool = c.questions.filter(q=>!curLv || q.level===curLv).map(q=>({q, cat:c.id}));
  if(!pool.length){ alert("当前筛选范围内没有题目，换个分类或难度试试"); return; }
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  quiz = {
    list:pool, idx:0, revealed:false, graded:false, pick:0,
    results:{know:0, fuzzy:0, no:0},
    rangeDesc:`范围：${c.icon||"📘"} ${c.name} · ${curLv?LEVELS[curLv]:"全部难度"} · 随机 ${pool.length} 题 · 空格 显示答案，1/2/3 自评`
  };
  view = "quiz";
  closeMobileSidebar();
  renderAll();
  document.getElementById("main").scrollTop = 0;
}
function grade(g){
  if(!quiz || quiz.graded) return;
  const item = quiz.list[quiz.idx];
  if(g===1){ setDone(item.q.id, true); quiz.results.know++; }
  else {
    addWrong(item.q, item.cat);
    if(g===2) quiz.results.fuzzy++; else quiz.results.no++;
  }
  quiz.graded = true; quiz.pick = g;
  renderMain();
}
function nextQ(){
  quiz.idx++; quiz.revealed = false; quiz.graded = false; quiz.pick = 0;
  renderMain();
  document.getElementById("main").scrollTop = 0;
}
function renderQuiz(){
  if(!quiz){ view = "cat"; renderMain(); return; }
  document.getElementById("cathead").innerHTML = `<h2>🎯 自测模式</h2><p>${esc(quiz.rangeDesc)}</p>`;
  document.getElementById("filters").innerHTML = "";
  if(quiz.idx >= quiz.list.length){
    const r = quiz.results, n = quiz.list.length;
    main.innerHTML = `
      <div class="quizend">
        <div class="big">🏁</div>
        <h3>本轮自测完成！</h3>
        <div class="stat">
          <span><b>${n}</b>总题数</span>
          <span><b style="color:var(--lv1)">${r.know}</b>✅ 会（已计掌握）</span>
          <span><b style="color:var(--lv2)">${r.fuzzy}</b>🤔 模糊（已入错题本）</span>
          <span><b style="color:var(--lv3)">${r.no}</b>❌ 不会（已入错题本）</span>
        </div>
        <div class="quizctl" style="justify-content:center">
          <button class="qbtn primary" id="qAgain">🔁 再来一轮</button>
          <button class="qbtn" id="qWrong">📕 去看错题本</button>
          <button class="qbtn" id="qExit">返回题库</button>
        </div>
      </div>`;
    document.getElementById("qAgain").onclick = startQuiz;
    document.getElementById("qWrong").onclick = ()=>{ view="wrong"; quiz=null; renderAll(); };
    document.getElementById("qExit").onclick = ()=>{ view="cat"; quiz=null; renderAll(); };
    renderSidebar();
    return;
  }
  const item = quiz.list[quiz.idx], q = item.q;
  const ctl = !quiz.revealed
    ? `<button class="qbtn primary" id="qShow">👁 显示答案（空格）</button>
       <button class="qbtn" id="qQuit">退出自测</button>`
    : quiz.graded
      ? `<span class="qhint">已自评 ${["","✅ 会","🤔 模糊","❌ 不会"][quiz.pick]}，该题${quiz.pick===1?"已计入掌握":"已加入错题本"}</span>
         ${quiz.pick!==1 && tutOfQ(q.id)?`<button class="qbtn" id="qTut">📘 去补课</button>`:""}
         <button class="qbtn primary" id="qNext">下一题（空格）⏭</button>`
      : `<button class="qbtn g1" data-g="1">✅ 会（1）</button>
         <button class="qbtn g2" data-g="2">🤔 模糊（2）</button>
         <button class="qbtn g3" data-g="3">❌ 不会（3）</button>`;
  main.innerHTML = `
    <div class="quizbox">
      <div class="qprog">
        <span>第 <b>${quiz.idx+1}</b> / ${quiz.list.length} 题</span>
        <span class="lv lv${q.level}">${LEVELS[q.level]||""}</span>
        <span style="margin-left:auto">✅${quiz.results.know} 🤔${quiz.results.fuzzy} ❌${quiz.results.no}</span>
      </div>
      <div class="qcard open">
        <div class="qhead" style="cursor:default">
          <span class="no">${q.id}</span>
          <span class="qt">${esc(q.q)}</span>
        </div>
        ${quiz.revealed?`<div class="qbody" style="display:block">${qbodyHTML(q)}</div>`
          :`<div class="qbody" style="padding:20px;color:var(--muted);font-size:13px">🤫 先在心里作答，再点击「显示答案」对照…</div>`}
      </div>
      <div class="quizctl">${ctl}</div>
    </div>`;
  const qs = document.getElementById("qShow"); if(qs) qs.onclick = ()=>{ quiz.revealed=true; renderMain(); };
  const qq = document.getElementById("qQuit"); if(qq) qq.onclick = ()=>{ view="cat"; quiz=null; renderAll(); };
  const qn = document.getElementById("qNext"); if(qn) qn.onclick = nextQ;
  const qt = document.getElementById("qTut"); if(qt) qt.onclick = ()=>{
    const item = quiz.list[quiz.idx];
    tutBack = {view:"quiz", curCat, curLv, kw};
    goTutNode(item.cat, tutOfQ(item.q.id).node.id);
  };
  main.querySelectorAll(".qbtn[data-g]").forEach(b=>b.onclick=()=>grade(+b.dataset.g));
  // 自测内也允许直接点「标记掌握」
  main.querySelectorAll(".donebtn").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    setDone(b.dataset.id, !store.done[b.dataset.id]);
    if(!quiz.graded){ quiz.graded=true; quiz.pick=1; quiz.results.know++; }
    renderAll();
  });
}

function renderMain(){
  if(view==="quiz"){ renderQuiz(); return; }
  if(view==="dash"){ renderDash(); return; }
  const k = kw.trim().toLowerCase();
  if(view==="wrong"){ renderWrong(); return; }
  if(view==="due"){ renderDue(); return; }
  if(view==="tut"){ renderTutGraph(); return; }
  if(view==="tutread"){ renderTutRead(); return; }
  if(k && scopeTut){ renderTutSearch(k); return; }
  if(k && scopeAll){ renderGlobal(k); return; }
  renderCat();
}

    `总进度：${dn} / ${all.length} 题已标记掌握<div class="bar"><i style="width:${all.length?Math.round(dn/all.length*100):0}%"></i></div>`;

  document.getElementById("tDue").classList.toggle("active", view==="due");
  document.getElementById("tWrong").classList.toggle("active", view==="wrong");
  document.getElementById("tDash").classList.toggle("active", view==="dash");

  // 收纳角标（到期+错题汇总）与面板状态联动
  const moreN = dueN + wrongN;

/* ---- 键盘快捷键 ---- */
document.addEventListener("keydown", e=>{
  const tag = (e.target.tagName||"").toLowerCase();
  const typing = tag==="input" || tag==="textarea";
  if(view==="tutread" && e.key==="Escape" && !typing){ view="tut"; renderAll(); return; }
  if(view==="quiz" && quiz && quiz.idx<quiz.list.length){
    if(typing) return;
    if(e.code==="Space"){
      e.preventDefault();
      if(!quiz.revealed){ quiz.revealed=true; renderMain(); }
      else if(quiz.graded){ nextQ(); }
    } else if(quiz.revealed && !quiz.graded && (e.key==="1"||e.key==="2"||e.key==="3")){
      grade(+e.key);
    }
    return;
  }
  if(!typing && e.key==="/"){
    e.preventDefault();
    if(isMobile()){ sidebarEl.classList.add("open"); maskEl.classList.add("show"); }
    else if(sidebarEl.classList.contains("collapsed")){ toggleSidebar(); }
    qInput.focus();
  }
});

/* ---- 备份/恢复 ---- */
function backupProgress(){
  const data = {
    version: 2,
    exportDate: new Date().toISOString(),
    keys: {}
  };
  ["qb_done","qb_done_ts","qb_wrong","qb_review","qb_cat","qb_scope","qb_theme","qb_tut_done","qb_tut_pos","qb_tut_note"].forEach(k=>{
    data.keys[k] = localStorage.getItem(k);
  });
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  const d = new Date().toISOString().slice(0,10);
  a.href = URL.createObjectURL(blob);
  a.download = `interview-backup-${d}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function restoreProgress(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data.keys) throw new Error("文件格式不正确");
      Object.keys(data.keys).forEach(k=>{
        if(data.keys[k] !== null) localStorage.setItem(k, data.keys[k]);
      });
      alert("✅ 进度恢复成功！页面将刷新以应用更改。");
      location.reload();
    }catch(err){
      alert("❌ 恢复失败：" + err.message);
    }
  };
  reader.readAsText(file);
}

/* ==================== 教程知识库 ==================== */
const TUT_LAYERS = ["入门","核心","进阶","实战"];
function escNl(s){ return esc(s).replace(/\n/g,"<br>"); }
function escA(s){ return esc(s).replace(/"/g,"&quot;"); }
function splitTxt(s, n){
  s = String(s||"");
  if(s.length <= n) return [s,""];
  return [s.slice(0,n), s.slice(n, n*2)+(s.length>n*2?"…":"")];
}
function renderBlock(b){
  switch(b.t){
    case "lead": return `<div class="tb-block tb-lead">${escNl(b.text)}</div>`;
    case "pre": return `<div class="tb-block tb-pre"><b>📌 前置知识：</b>${(b.items||[]).map(escNl).join(" → ")}</div>`;
    case "h": return `<div class="tb-block tb-h">${esc(b.text)}</div>`;
    case "p": return `<div class="tb-block tb-p">${escNl(b.text)}</div>`;
    case "list": return `<ul class="tb-block tb-list">${(b.items||[]).map(i=>`<li>${escNl(i)}</li>`).join("")}</ul>`;
    case "code": return `<div class="tb-block tb-code"><div class="cd-lang">${esc(b.lang||"code")}</div><pre><code>${esc(b.code)}</code></pre></div>`;
    case "svg": return `<div class="tb-block tb-svg">${b.svg||""}${b.caption?`<div class="cap">${esc(b.caption)}</div>`:""}</div>`;
    case "table": return `<table class="tb-table"><thead><tr>${(b.head||[]).map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${(b.rows||[]).map(r=>`<tr>${r.map(x=>`<td>${escNl(x)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    case "pits": return `<div class="tb-block tb-pits"><div class="pt">⚠️ 常见坑 · 面试官爱挖</div><ul>${(b.items||[]).map(i=>`<li>${escNl(i)}</li>`).join("")}</ul></div>`;
    case "callout": {
      const icon = b.kind==="unverified" ? "❓ 存疑" : b.kind==="warn" ? "⚠️" : "💡";
      return `<div class="tb-block tb-callout ${esc(b.kind||"tip")}">${icon} ${escNl(b.text)}</div>`;
    }
    default: return "";
  }
}
function renderTutGraph(){
  const tb = tutOf(tutCat);
  if(!tb){ view="cat"; renderMain(); return; }
  const tp = tutProgress(tb);
  const layers = [[],[],[],[]];
  tb.nodes.forEach(n=>{ layers[Math.min(3, n.layer||0)].push(n); });
  const W=158, H=64, GX=18, ROW=150, TOP=52, PAD=24;
  const pos = {};
  const maxW = Math.max(...layers.map(l=>l.length), 1);
  const SW = Math.max(640, PAD*2 + maxW*W + (maxW-1)*GX);
  const SH = TOP + 4*ROW + PAD + 6;
  layers.forEach((ls, li)=>{
    const totalW = ls.length*W + (ls.length-1)*GX;
    let x = (SW - totalW)/2;
    ls.forEach(n=>{ pos[n.id] = {x, y: TOP + li*ROW}; x += W + GX; });
  });
  let edges = "";
  tb.nodes.forEach(n=>{
    (n.depends||[]).forEach(d=>{
      const a = pos[d], b = pos[n.id];
      if(!a || !b) return;
      const x1 = a.x + W/2, y1 = a.y + H, x2 = b.x + W/2, y2 = b.y, my = (y1+y2)/2;
      edges += `<path class="g-edge" marker-end="url(#gArr)" d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}"/>`;
    });
  });
  const ARROW = `<defs><marker id="gArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>`;
  let nodesHtml = "";
  tb.nodes.forEach(n=>{
    const p = pos[n.id];
    const done = tutNodeDone(n);
    const cls = "g-node" + (done?" done":"");
    const [t1,t2] = splitTxt(n.title, 10);
    const st = done ? "✓ 已学完" : `关联 ${(n.covers||[]).length} 题`;
    nodesHtml += `<g class="${cls}" data-tutnode="${escA(n.id)}" transform="translate(${p.x},${p.y})">
      <rect width="${W}" height="${H}" rx="10"/>
      <text x="${W/2}" y="27" text-anchor="middle" class="t1">${escA(t1)}</text>
      <text x="${W/2}" y="46" text-anchor="middle" class="t1" opacity=".8">${escA(t2)}</text>
      <text x="${W/2}" y="60" text-anchor="middle" class="t2">${escA(st)}</text>
    </g>`;
  });
  const layerLbl = layers.map((ls, li)=> ls.length? `<text class="g-layer" x="14" y="${TOP + li*ROW + 36}">${TUT_LAYERS[li]}</text>` : "").join("");
  document.getElementById("cathead").innerHTML = `
    <div class="tutbar">
      <button class="btn" onclick="view='cat';renderAll()">← 刷题</button>
      <h2>${tb.icon||"📘"} ${esc(tb.name)} · 知识库</h2>
      <span class="tb-prog">已学 <b>${tp.done}</b> / ${tp.total} 篇</span>
      <button class="btn" onclick="printTut('cat')">🖨 打印全分类</button>
    </div>`;
  document.getElementById("filters").innerHTML = "";
  main.innerHTML = `
    <div id="tutGraphWrap"><svg viewBox="0 0 ${SW} ${SH}">${ARROW}${edges}${layerLbl}${nodesHtml}</svg></div>
    <div class="g-hint">💡 推荐学习顺序：<b>入门 → 核心 → 进阶 → 实战</b>，箭头表示「建议先学 A 再学 B」——仅作参考，<b>所有章节随时可学</b>。点开任意节点开始阅读，读完点「✔ 标记已学完」记录进度。</div>`;
  main.querySelectorAll(".g-node").forEach(g=>g.onclick=()=>goTutNode(tutCat, g.dataset.tutnode));
}
function renderTutRead(){
  const tb = tutOf(tutCat);
  const node = tutNodeById(tb, tutNode);
  if(!tb || !node){ view="tut"; renderAll(); return; }
  const tp = tutProgress(tb);
  const done = tutNodeDone(node);
  const navHtml = (function(){
    let html = "";
    const layers=[[],[],[],[]];
    tb.nodes.forEach(n=>layers[Math.min(3,n.layer||0)].push(n));
      layers.forEach((ls,li)=>{
        if(!ls.length) return;
        html += `<div class="tn-l">${TUT_LAYERS[li]}</div>`;
        ls.forEach(n=>{
          const nd = tutNodeDone(n);
          html += `<div class="tn-item ${n.id===node.id?'cur':''} ${nd?'done':''}" data-nid="${escA(n.id)}">
          <span>${nd?"✅":"📖"}</span><span>${esc(n.title)}</span><span class="st">${nd?"✓":""}</span></div>`;
        });
      });
    return html;
  })();
  const bodyHtml = node.body.map(renderBlock).join("");
  const coversHtml = (node.covers||[]).map(id=>{
    const f = findQ(id);
    return f? qcardHTML(f.q, {catName:f.catName, plain:true}) : "";
  }).join("");
  const quizHtml = (node.quiz||[]).map((id,i)=>{
    const f = findQ(id);
    if(!f) return "";
    return `<div class="qitem" data-qid="${escA(id)}">
      <div class="qq">${i+1}. ${esc(f.q.q)}</div>
      <div class="qa">${esc(f.q.a)}</div>
      <div class="qctl">
        <button class="yes">✅ 答对了</button>
        <button class="no">❌ 还不会</button>
        <button class="show">👁 看答案</button>
        <span class="msg"></span>
      </div></div>`;
  }).join("");
  const note = store.tutNote[node.id]||"";
  const idx = tb.nodes.findIndex(n=>n.id===node.id);
  const prev = tb.nodes[idx-1], next = tb.nodes[idx+1];
  document.getElementById("cathead").innerHTML = `
    <div class="tutbar">
      <button class="btn" onclick="goTutBack()">← 返回</button>
      <h2>${tb.icon||"📘"} ${esc(tb.name)}</h2>
      <span class="tb-prog">已学 <b>${tp.done}</b> / ${tp.total} 篇</span>
      <button class="btn" onclick="printTut('node')">🖨 打印本篇</button>
    </div>`;
  document.getElementById("filters").innerHTML = "";
  main.innerHTML = `
    <div class="tutwrap">
      <nav class="tutnav">${navHtml}</nav>
      <article class="tutmain">
        <div class="tm-head">
          <div class="tm-title">${esc(node.title)} ${done?`<span class="lv lv1" style="margin-left:auto">已学完</span>`:""}</div>
          <div class="tm-meta">
            <span class="chip-lv">${TUT_LAYERS[Math.min(3,node.layer||0)]}</span>
            <span>📖 第 ${idx+1} / ${tb.nodes.length} 篇</span>
            <span>🔗 关联 ${(node.covers||[]).length} 题</span>
            ${(node.depends||[]).length?`<span>建议先学：${node.depends.map(d=>esc((tutNodeById(tb,d)||{title:d}).title)).join("、")}</span>`:""}
          </div>
        </div>
        ${bodyHtml}
        ${coversHtml?`<div class="tb-related"><div class="rl">🔗 关联面试题（学完去测，检验是否真懂）</div>${coversHtml}</div>`:""}
        ${quizHtml?`<div class="tb-quiz"><div class="ql">🧪 随堂小测（答错的自动进错题本）</div>${quizHtml}</div>`:""}
        <div class="tb-note">
          <div class="nl">📝 我的笔记（仅本机保存，复习时优先回看）</div>
          <textarea id="tutNote" placeholder="在这里写你的心得、疑问、项目场景…">${esc(note)}</textarea>
        </div>
        <div class="tb-foot">
          <button class="btn ${done?'':'donebtn'}" onclick="setTutDone('${escA(node.id)}', ${done?'false':'true'});renderAll()">${done?"↩ 取消已学完":"✔ 标记已学完"}</button>
          ${prev?`<button class="btn prev" onclick="goTutNode('${escA(tutCat)}','${escA(prev.id)}')">← ${esc(prev.title)}</button>`:""}
          ${next?`<button class="btn prev" onclick="goTutNode('${escA(tutCat)}','${escA(next.id)}')">${esc(next.title)} →</button>`:""}
          <button class="btn tb-back" onclick="view='tut';renderAll()">🗺 返回图谱</button>
        </div>
      </article>
    </div>`;
  main.querySelectorAll(".tn-item").forEach(el=>el.onclick=()=>goTutNode(tutCat, el.dataset.nid));
  bindCards();
  main.querySelectorAll(".tb-quiz .qitem").forEach(item=>{
    const f = findQ(item.dataset.qid);
    item.querySelector(".show").onclick = ()=> item.classList.add("open");
    item.querySelector(".yes").onclick = ()=>{
      item.querySelector(".msg").textContent = "👍 不错，这道已掌握";
      item.classList.add("open");
    };
    item.querySelector(".no").onclick = ()=>{
      if(f) addWrong(f.q, f.cat);
      item.querySelector(".msg").textContent = "📕 已加入错题本，复习时重点看";
      item.classList.add("open");
      renderSidebar();
    };
  });
  const ta = document.getElementById("tutNote");
  if(ta){
    let timer = null;
    ta.oninput = ()=>{
      clearTimeout(timer);
      timer = setTimeout(()=>{
        const n = store.tutNote; n[node.id] = ta.value; store.tutNote = n;
      }, 400);
    };
  }
  requestAnimationFrame(()=>{ const sp = store.tutPos[node.id]; if(sp) main.scrollTop = sp; });
  let last = 0;
  main.onscroll = ()=>{
    const now = Date.now();
    if(now - last < 300) return;
    last = now;
    const p = store.tutPos; p[node.id] = main.scrollTop; store.tutPos = p;
  };
}
function renderTutSearch(k){
  const rows = [];
  tutCats().forEach(tb=>{
    tb.nodes.forEach(n=>{
      const hay = (n.title + " " + n.body.map(b=>{
        if(b.t==="svg") return String(b.svg).replace(/<[^>]+>/g," ");
        if(b.t==="code") return b.code||"";
        return (b.text||"") + " " + (b.items||[]).join(" ") + " " + (b.head||[]).join(" ") + " " + (b.rows||[]).flat().join(" ");
      }).join(" ")).toLowerCase();
      if(hay.includes(k)) rows.push({tb, n});
    });
  });
  document.getElementById("cathead").innerHTML =
    `<h2>🔍 教程搜索</h2><p>关键词「${esc(kw.trim())}」· 跨全部教程正文/代码/图解标注（取消勾选「📘 搜教程」回到题库搜索）</p>`;
  document.getElementById("filters").innerHTML = "";
  main.innerHTML = rows.length
    ? `<div class="tutwrap" style="display:block"><div class="tutmain" style="padding:16px 20px">${rows.map(r=>`
        <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;background:var(--bg)" data-r="${escA(r.n.id)}" data-c="${escA(r.tb.id)}">
          <span style="font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:2px 8px;white-space:nowrap">${esc(r.tb.name)}</span>
          <span style="flex:1;font-size:14px;font-weight:600">${hl(r.n.title, k)}</span>
          <span class="lv lv${Math.min(3,r.n.layer||0)+1}">${TUT_LAYERS[Math.min(3,r.n.layer||0)]}</span>
        </div>`).join("")}</div></div>`
    : `<div id="empty">教程里没有匹配「${esc(kw.trim())}」的内容</div>`;
  main.querySelectorAll("[data-r]").forEach(el=>el.onclick=()=>goTutNode(el.dataset.c, el.dataset.r));
}
function printTut(scope){
  const tb = tutOf(tutCat); if(!tb) return;
  const nodes = scope==="cat" ? tb.nodes : [tutNodeById(tb, tutNode)].filter(Boolean);
  if(!nodes.length) return;
  const pa = document.getElementById("printArea");
  pa.innerHTML = `<h1 style="font-size:20px">${esc(tb.icon)} ${esc(tb.name)} · 教程${scope==="cat"?"（全分类）":""}</h1>
    <div class="pr-cat">${esc(tb.name)} 知识库 · ${new Date().toLocaleDateString()} · 建议配合题库复习</div>` +
    nodes.map(n=>`<h1 style="font-size:17px;margin-top:22px">📖 ${esc(n.title)}</h1>` + n.body.map(renderBlock).join("")).join("");
  window.print();
}

/* ---- 统计看板 ---- */
function renderDash(){
  const done = store.done, wrong = store.wrong;
  const all = cats().flatMap(c=>c.questions);
  const total = all.length;
  const dn = all.filter(q=>done[q.id]).length;
  const wrongN = Object.keys(wrong).length;
  const dueN = dueList().length;
  const notDone = total - dn;

  // 难度分布
  const lvStats = [1,2,3].map(lv=>{
    const qs = all.filter(q=>q.level===lv);
    const d = qs.filter(q=>done[q.id]).length;
    return {lv, total:qs.length, done:d, pct:qs.length?Math.round(d/qs.length*100):0};
  });

  // SVG donut chart (done vs not done)
  const R=52, C=2*Math.PI*R, doneArc = total? (dn/total)*C : 0;
  const donutSVG = `<svg class="donut" viewBox="0 0 130 130">
    <circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--line)" stroke-width="16"/>
    <circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--done)" stroke-width="16"
      stroke-dasharray="${doneArc} ${C}" stroke-dashoffset="0" transform="rotate(-90 65 65)" stroke-linecap="round"/>
    <text x="65" y="62" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">${dn}</text>
    <text x="65" y="80" text-anchor="middle" font-size="11" fill="var(--muted)">/${total} 已掌握</text>
  </svg>`;

  // 难度饼图
  const lvColors = ["var(--lv1)","var(--lv2)","var(--lv3)"];
  const lvNames = ["基础必会","进阶高频","深挖架构"];
  let pieSVG = `<svg width="130" height="130" viewBox="0 0 130 130">`;
  let acc = 0;
  lvStats.forEach((s,i)=>{
    if(s.total===0) return;
    const frac = s.total/total;
    const startAngle = acc*2*Math.PI - Math.PI/2;
    const endAngle = (acc+frac)*2*Math.PI - Math.PI/2;
    acc += frac;
    const x1=65+50*Math.cos(startAngle), y1=65+50*Math.sin(startAngle);
    const x2=65+50*Math.cos(endAngle), y2=65+50*Math.sin(endAngle);
    const large = frac>0.5?1:0;
    if(frac >= 1){
      pieSVG += `<circle cx="65" cy="65" r="50" fill="${lvColors[i]}"/>`;
    } else {
      pieSVG += `<path d="M65,65 L${x1},${y1} A50,50 0 ${large} 1 ${x2},${y2} Z" fill="${lvColors[i]}"/>`;
    }
  });
  pieSVG += `<circle cx="65" cy="65" r="28" fill="var(--panel)"/>
    <text x="65" y="69" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)">${total}</text>
  </svg>`;

  // 每分类进度
  const catRows = cats().map(c=>{
    const d = c.questions.filter(q=>done[q.id]).length;
    const pct = c.questions.length? Math.round(d/c.questions.length*100):0;
    const w = c.questions.filter(q=>wrong[q.id]).length;
    return {id:c.id, name:c.name, icon:c.icon, total:c.questions.length, done:d, pct, wrong:w};
  });

  document.getElementById("cathead").innerHTML = `<h2>📊 复习统计看板</h2><p>全面掌握你的复习进度、薄弱环节和复习节奏</p>`;
  document.getElementById("filters").innerHTML = "";

  main.innerHTML = `
    <div class="stat-grid">
      <div class="stat-box"><div class="num" style="color:var(--done)">${dn}</div><div class="lbl">已掌握题目</div></div>
      <div class="stat-box"><div class="num" style="color:var(--lv3)">${wrongN}</div><div class="lbl">错题本</div></div>
      <div class="stat-box"><div class="num" style="color:var(--lv2)">${dueN}</div><div class="lbl">今日到期复习</div></div>
      <div class="stat-box"><div class="num" style="color:var(--accent)">${total}</div><div class="lbl">题目总数</div></div>
    </div>
    <div class="dashgrid">
      <div class="dashcard">
        <h3>🎯 总体掌握率</h3>
        <div class="donut-wrap">
          ${donutSVG}
          <div class="donut-legend">
            <div><span class="dot" style="background:var(--done)"></span>已掌握 ${dn} 题（${total?Math.round(dn/total*100):0}%）</div>
            <div><span class="dot" style="background:var(--line)"></span>未掌握 ${notDone} 题（${total?Math.round(notDone/total*100):0}%）</div>
          </div>
        </div>
      </div>
      <div class="dashcard">
        <h3>📊 难度分布</h3>
        <div class="lv-pie">
          ${pieSVG}
          <div class="donut-legend">
            ${lvStats.map((s,i)=>`<div><span class="dot" style="background:${lvColors[i]}"></span>${lvNames[i]}：${s.done}/${s.total}（${s.pct}%）</div>`).join("")}
          </div>
        </div>
      </div>
    </div>
    <div class="dashcard" style="margin-bottom:16px">
      <h3>📚 各分类进度</h3>
      ${catRows.map(r=>`
        <div class="dashrow">
          <span class="lbl" title="${r.name}">${r.icon||"📘"} ${r.name}</span>
          <span class="track"><i style="width:${r.pct}%;background:var(--done)"></i></span>
          <span class="val">${r.done}/${r.total}${r.wrong?` ·📕${r.wrong}`:""}</span>
        </div>
      `).join("")}
    </div>
  `;
}

function renderAll(){ renderSidebar(); renderMain(); }
renderAll();
