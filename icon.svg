<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b0713c"/>
      <stop offset="100%" stop-color="#8a5528"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Coffee cup (Java) stylized as game controller -->
  <g filter="url(#shadow)" transform="translate(256,256)">
    <!-- Cup body -->
    <path d="M-80,-50 L-80,40 Q-80,80 -40,80 L40,80 Q80,80 80,40 L80,-50 Z" fill="#fff" opacity="0.95"/>
    <!-- Handle -->
    <path d="M80,-20 Q120,-20 120,10 Q120,40 80,40" fill="none" stroke="#fff" stroke-width="14" opacity="0.95"/>
    <!-- Steam (game-like) -->
    <path d="M-35,-80 Q-25,-95 -35,-110 Q-45,-125 -35,-140" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <path d="M0,-80 Q10,-95 0,-110 Q-10,-125 0,-140" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <path d="M35,-80 Q45,-95 35,-110 Q25,-125 35,-140" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <!-- "J" letter -->
    <text x="0" y="35" text-anchor="middle" font-size="70" font-weight="900" fill="#b0713c" font-family="Arial,sans-serif">J</text>
  </g>
</svg>
