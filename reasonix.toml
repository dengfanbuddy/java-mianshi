-WebRequest -Uri 'http://localhost:7399/%zz' -UseBasicParsing -TimeoutSec 3).StatusCode } catch { Write-Output \"ERR $($_.Exception.Message)\" }\nStart-Sleep -Seconds 1\n$alive = Get-Process -Name node -ErrorAction SilentlyContinue; if ($alive) { Write-Output \"--- node 进程仍存活 ---\" } else { Write-Output \"--- node 进程已崩溃 ---\" }", "Bash=$node = Get-Process -Name node -ErrorAction SilentlyContinue; if ($node) { $node | Stop-Process -Force; Start-Sleep -Milliseconds 500 }\nStart-Process node -ArgumentList 'serve.js','--port','7399' -WorkingDirectory 'E:\\project2\\java_mianshi' -WindowStyle Hidden | Out-Null; Start-Sleep -Seconds 1\nWrite-Output \"--- A: 真实穿越 /../dazirouge/ ---\"\ncurl.exe -s --path-as-is -o NUL -w \"HTTP %{http_code} size=%{size_download}`n\" \"http://localhost:7399/../dazirouge/index.html\"\nWrite-Output \"--- B: 穿越读根目录 --\"\ncurl.exe -s --path-as-is -o NUL -w \"HTTP %{http_code}`n\" \"http://localhost:7399/../../../\"\nWrite-Output \"--- C: 畸形编码 %zz ---\"\ncurl.exe -s --path-as-is -o NUL -w \"HTTP %{http_code}`n\" \"http://localhost:7399/%zz\"\nWrite-Output \"--- D: 反斜杠穿越 ---\"\ncurl.exe -s --path-as-is -o NUL -w \"HTTP %{http_code}`n\" \"http://localhost:7399/%5c%2e%2e%5c%2e%2e%5cdazirouge%5c\"\nStart-Sleep -Milliseconds 800\nif (Get-Process -Name node -ErrorAction SilentlyContinue) { Write-Output \"--- node 存活 ---\" } else { Write-Output \"--- node 已崩溃 ---\" }", "Bash=node -e \"try{decodeURIComponent('%zz')}catch(e){console.log('decodeURIComponent 抛异常:', e.constructor.name, '-', e.message)}\"; Write-Output \"----\"; node -e \"const path=require('path'); const root='E:\\\\\\\\project2\\\\\\\\java_mianshi'; const f=path.join(root, path.normalize('/E:/Windows/win.ini')); console.log('盘符路径 join 结果:', f); console.log('startsWith(root) 通过?', f.startsWith(root)); const f2=path.join(root, path.normalize('/../java_mianshi2/x')); console.log('.. 路径:', f2, '| 在root内?', f2.startsWith(root));\"", "Bash=Select-String -Path index.html -Pattern '<script src=' | ForEach-Object { $_.Line.Trim() }; Write-Output \"=====print.html 头部=====\"; Get-Content print.html -TotalCount 12; Write-Output \"=====data 总大小=====\"; (Get-ChildItem data -Filter *.js | Measure-Object Length -Sum).Sum / 1MB", "Bash=Write-Output \"===== print.html 编码检查 =====\"; $b = [System.IO.File]::ReadAllBytes('E:\\project2\\java_mianshi\\print.html')[0..200]; $utf8 = [System.Text.Encoding]::UTF8.GetString($b); Write-Output \"UTF8 解码前200字节:\"; Write-Output $utf8; $gbk = [System.Text.Encoding]::GetEncoding('GB2312').GetString($b); Write-Output \"GB2312 解码前200字节:\"; Write-Output $gbk\nWrite-Output \"\"; Write-Output \"===== 前缀攻击验证(纯node) =====\"; node -e \"const path=require('path'); const root=path.resolve('E:/project2/java_mianshi'); const p1=path.join(root, path.normalize('/../java_mianshi2/x.txt')); const p2=path.join(root, path.normalize('/%2e%2e/dazirouge/x')); console.log('p1 =', JSON.stringify(p1)); console.log('p1 startsWith(root):', p1.startsWith(root)); console.log('p2 =', JSON.stringify(p2)); console.log('p2 startsWith(root):', p2.startsWith(root));\"", "Bash=Select-String -Path print.html -Pattern 'script src|data/' | Select-Object -First 6 | ForEach-Object { $_.Line.Trim() }; Write-Output \"=====\"; (Get-Content print.html).Count; Write-Output \"===== git 状态 =====\"; git -C E:\\project2\\java_mianshi status --short 2>&1 | Select-Object -First 5; git -C E:\\project2\\java_mianshi log --oneline -3 2>&1"]
