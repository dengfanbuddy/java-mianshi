allow = ["Bash=Get-ChildItem -Recurse -Depth 2 | Select-Object FullName | Format-Table -AutoSize", "Edit", "Bash=node -e \"const fs=require('fs');const html=fs.readFileSync('index.html','utf8');const m=[...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)];m.forEach((x,i)=>{try{new Function(x[1]);console.log('inline script',i+1,'OK,',x[1].length,'chars')}catch(e){console.log('inline script',i+1,'ERROR:',e.message)}})\"", "Bash=node -e \"\nconst fs=require('fs');\nconst html=fs.readFileSync('index.html','utf8');\nconst ids=[...html.matchAll(/id=\\\"([^\\\"]+)\\\"/g)].map(m=>m[1]);\nconst js=[...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)][0][1];\nconst refs=[...js.matchAll(/getElementById\\(\\\"([^\\\"]+)\\\"\\)/g)].map(m=>m[1]);\nconst missing=[...new Set(refs)].filter(r=>!ids.includes(r));\nconsole.log('HTML ids:',ids.length,'| JS getElementById refs:',new Set(refs).size);\nconsole.log(missing.length?'MISSING: '+missing.join(', '):'all element refs resolve OK');\n// 关键交互元素\n['moreBtn','helpBtn','collapseBtn','menuBtn','tools','helpBox','moreCnt','dueCnt','wrongCnt','tQuiz','tDue','tWrong','tDash','tBackup','tRestore'].forEach(id=>{\n  if(!ids.includes(id)) console.log('MISSING required id:',id);\n});\nconsole.log('done');\n\"", "Bash=Remove-Item tools/check-layout.js; Select-String -Path index.html -Pattern 'shortcuts|closeMobileSidebar|#sideFoot|side-collapsed' | ForEach-Object { \"$($_.LineNumber): $($_.Line.Trim())\" }", "Bash=node -e \"const fs=require('fs');const html=fs.readFileSync('index.html','utf8');const m=[...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)];m.forEach((x,i)=>{try{new Function(x[1]);console.log('script',i+1,'OK')}catch(e){console.log('script',i+1,'ERROR:',e.message)}});console.log('negative margin left:', html.includes('margin-left:-280px')||html.includes('margin-left: -280px'));\"", "Bash(node tools/qa-check.js:*)", "Bash(node tools/export-anki.js:*)", "Bash=node -e \"\nconst fs=require('fs'),vm=require('vm');\nconst files=fs.readdirSync('data').filter(f=>f.endsWith('.js')).sort();\nconst sb={window:{}};vm.createContext(sb);\nfor(const f of files)vm.runInContext(fs.readFileSync('data/'+f,'utf8'),sb);\nconst ORDER=JSON.parse(fs.readFileSync('index.html','utf8').match(/const ORDER = \\[([^\\]]+)\\]/)[1].replace(/'/g,'\\\"'));\nconst ok=ORDER.every(id=>sb.window.QB[id]);\nconsole.log('index.html ORDER 分类数:',ORDER.length,'| 全部可解析:',ok,'| 首个分类:',ORDER[0]);\nconst ph=fs.readFileSync('print.html','utf8');\nconst po=JSON.parse(ph.match(/const ORDER = \\[([^\\]]+)\\]/)[1].replace(/'/g,'\\\"'));\nconsole.log('print.html ORDER 分类数:',po.length,'| 含 study-methods:',po.includes('study-methods'));\nconsole.log('index.html 引用 study-methods.js:',fs.readFileSync('index.html','utf8').includes('data/study-methods.js'));\nconsole.log('print.html 引用 study-methods.js:',ph.includes('data/study-methods.js'));\n\"", "Bash=node _verify.js; Remove-Item _verify.js", "review", "run_skill", "Bash=git status --short 2>$null; if (-not $?) { Write-Output \"not a git repo\" }", "Bash=Get-ChildItem -Force | Select-Object Mode, Length, Name", "Bash=Get-ChildItem data, tools, anki | Select-Object Directory, Length, Name", "Bash=Select-String -Path index.html -Pattern \"<script>\" | Select-Object LineNumber, Line; (Get-Content index.html).Count", "Bash=Select-String -Path data/netty.js -Pattern '\"q\":' | Select-Object -First 40 | ForEach-Object { $_.Line.Trim() }", "Bash=Select-String -Path data/game-server.js -Pattern '\"q\":' | Select-Object -First 40 | ForEach-Object { $_.Line.Trim() }", "Bash=Select-String -Path data/mysql.js -Pattern '\"q\":' | Select-Object -First 35 | ForEach-Object { $_.Line.Trim() }; Write-Output \"=====REDIS=====\"; Select-String -Path data/redis.js -Pattern '\"q\":' | Select-Object -First 35 | ForEach-Object { $_.Line.Trim() }", "Bash=Select-String -Path data/mysql.js -Pattern 'q: \"' | Select-Object -First 8 | ForEach-Object { $_.Line.Trim() }; Write-Output \"=====REDIS=====\"; Select-String -Path d